[pytest]
# Look for tests only in the tests/ folder
testpaths = tests

# Standard naming conventions for test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -v         : verbose output (one line per test)
# -s         : show print/log output live in the console
# --tb=short : shorter tracebacks on failure
addopts = -v -s --tb=short

# Show INFO-level logs from our page objects and tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
